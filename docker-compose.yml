version: "3.8"

services:
  mariadb:
    image: mariadb:10.11
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: library
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql

  inputapp:
    build: ./inputapp
    container_name: inputapp
    ports:
      - "5001:5000"
    environment:
      DB_HOST: mariadb
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: library
    depends_on:
      - mariadb

  displayapp:
    build: ./displayapp
    container_name: displayapp
    ports:
      - "5002:5000"
    environment:
      DB_HOST: mariadb
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: library
    depends_on:
      - mariadb

volumes:
  mariadb-data:
