<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peminjaman Alat Lab</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: white; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 { color: #333; margin-bottom: 10px; text-align: center; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        .msg { 
            padding: 12px; 
            margin: 20px 0; 
            border-radius: 6px; 
            font-weight: 500;
        }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        
        form { display: flex; flex-direction: column; gap: 15px; }
        label { font-weight: 600; color: #333; }
        input, select { 
            padding: 12px; 
            font-size: 16px; 
            border: 2px solid #ddd; 
            border-radius: 6px;
            transition: border 0.3s;
            font-family: inherit;
        }
        input:focus, select:focus { 
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        button { 
            padding: 12px; 
            font-size: 16px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        button:active { transform: translateY(0); }
        
        .form-group { display: flex; flex-direction: column; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔬 Peminjaman Alat Laboratorium</h1>
        <p class="subtitle">Pinjam alat untuk pekerjaan lab Anda</p>
        
        {% if message %}
            <div class="msg {% if 'Error' in message or 'Please' in message %}error{% else %}success{% endif %}">{{ message }}</div>
        {% endif %}
        
        <form method="POST">
            <div class="form-group">
                <label for="equipment">Pilih Alat:</label>
                <select name="equipment_id" id="equipment" required>
                    <option value="">-- Pilih Alat --</option>
                    {% for equip in equipment_list %}
                    <option value="{{ equip.id }}">{{ equip.name }} ({% if equip.borrowed_count > 0 %}{{ equip.borrowed_count }} dipinjam{% else %}Tersedia{% endif %})</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="borrower">Nama Anda:</label>
                <input type="text" name="borrower_name" id="borrower" placeholder="Masukkan nama lengkap Anda" required>
            </div>
            <div class="form-group">
                <label for="nim">Nomor Induk Mahasiswa (NIM):</label>
                <input type="text" name="nim" id="nim" placeholder="Contoh: 12345678" required>
            </div>

            <div class="form-group">
                <label for="fakultas">Fakultas:</label>
                <select name="fakultas" id="fakultas" required>
                    <option value="">-- Pilih Fakultas --</option>
                    <option value="Fakultas Teknik Elektro">Fakultas Teknik Elektro</option>
                    <option value="Fakultas Rekayasa Industri">Fakultas Rekayasa Industri</option>
                    <option value="Fakultas Informatika">Fakultas Informatika</option>
                    <option value="Fakultas Ekonomi dan Bisnis">Fakultas Ekonomi dan Bisnis</option>
                    <option value="Fakultas Komunikasi dan Ilmu Sosial">Fakultas Komunikasi dan Ilmu Sosial</option>
                    <option value="Fakultas Industri Kreatif">Fakultas Industri Kreatif</option>
                    <option value="Fakultas Ilmu Terapan">Fakultas Ilmu Terapan</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="return_date">Tanggal Pengembalian:</label>
                <input type="date" name="return_date" id="return_date" required>
            </div>            
            <button type="submit">Pinjam Alat</button>
        </form>
    </div>
</body>
</html>
